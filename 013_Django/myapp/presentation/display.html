<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Display</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Product List</h4>
            </div>

            <div class="card-body">
                <table class="table table-bordered table-hover text-center align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Id</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for pro in products %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ pro.name }}</td>
                            <td>₹ {{ pro.price }}</td>
                            <td>{{ pro.qty }}</td>
                            <td><a href="{%url 'byid'%}?pid={{pro.id}}" class="btn btn-primary">Update</a></td>
                            <td><a href="{%url 'delete'%}?did={{pro.id}}" class="btn btn-dark" onclick="return confirm('Are you sure you want to delete this item?');">Delete</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <div class="text-center">
                    <a href="{% url 'index' %}" class="btn btn-secondary mt-3">
                        ⬅ Back to Register
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
