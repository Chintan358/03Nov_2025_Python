{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/app.js' %}"></script>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow">
                    <div class="card-body">

                        {% if pro%}
                        <h4 class="text-center mb-3">Update Product</h4>
                        {%else%}
                        <h4 class="text-center mb-3">Add Product</h4>
                        {%endif%}
                        {% if msg %}
                        <div class="alert alert-info text-center">
                            {{ msg }}
                        </div>
                        {% endif %}

                        <form action="{% url 'reg' %}" method="post">
                            {% csrf_token %}
                            <input type="hidden" name="id" value="{{pro.id}}">
                            <div class="mb-3">
                                <input type="text" name="name" class="form-control" placeholder="Enter product name"
                                    value="{{pro.name}}" required>
                            </div>

                            <div class="mb-3">
                                <input type="text" name="price" class="form-control" placeholder="Enter price"
                                    value="{{pro.price}}" required>
                            </div>

                            <div class="mb-3">
                                <input type="text" name="qty" class="form-control" placeholder="Enter quantity"
                                    value="{{pro.qty}}" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Save Product
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <a href="{% url 'display' %}" class="text-decoration-none">
                                View All Products
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
