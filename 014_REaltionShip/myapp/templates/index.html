<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header text-center">
                        {%if product%}
                        <h4>Update Product</h4>
                        {%else%}
                        <h4>Add Product</h4>
                        {%endif%}
                        <span class="btn btn-success"><a href="{%url 'view'%}">View Products</a></span>
                    </div>

                    <div class="card-body">
                        <form action="" method="post" enctype="multipart/form-data">
                            {%csrf_token%}
                            <div class="mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select name="category" id="category" class="form-select">
                                    <option value="0">--- Select Category ---</option>
                                    {%for category in categories%}
                                    <option value="{{category.id}}" {%if category.id == product.category.id %}selected{%endif%}>
                                        {{category.name}}</option>
                                    {%endfor%}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Enter name"
                                    value="{{product.name}}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <input type="text" name="price" class="form-control" placeholder="Enter price"
                                    value="{{product.price}}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Quantity</label>
                                <input type="text" name="qty" class="form-control" placeholder="Enter qty"
                                    value="{{product.qty}}">
                            </div>

                            {%if product%}
                            <div>
                                <img src="media/{{product.image}}" alt="" height="50px" width="50px">
                            </div>
                            {%endif%}

                            <div class="mb-3">
                                <label class="form-label">Image</label>
                                <input type="file" name="file" class="form-control">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary w-50">Submit</button>
                                <button type="reset" class="btn btn-secondary w-50">Reset</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
