<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        a {
            color: white;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4">Product List |
            <a href="{%url 'index'%}" class="btn btn-success">Add Product</a>
        </h2>
        <div class="row g-4">
            <!-- Product Loop Start -->

            {%for product in products%}
            <div class="col-md-3">
                <div class="card shadow-sm h-100">
                    <img src=media/{{product.image}} alt="{{product.image}}" class="card-img-top">

                    <div class="card-body">
                        <h5 class="card-title">{{product.name}}</h5>
                        <h6>{{product.category.name}}</h6>
                        <p class="card-text">
                            <strong>Price:</strong> ₹{{product.price}}<br>
                            <strong>Qty:</strong> {{product.qty}}
                        </p>
                    </div>

                    <div class="card-footer bg-white d-flex justify-content-between">
                        <button class="btn btn-sm btn-primary"><a
                                href="{%url 'edit'%}?eid={{product.id}}">Edit</a></button>
                        <button class="btn btn-sm btn-danger"><a
                                href="{%url 'delete'%}?did={{product.id}}">Delete</a></button>
                    </div>
                </div>
            </div>
            {%endfor%}

            <!-- Product Loop End -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
