<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <script>

        $(document).ready(function () {
            display()
            $("#upbtn").hide()
        })

        function search(q) {
            $.get('search', { q }, function (rt) {

                var rows = ""
                rt.students.map(ele => {
                    rows += `<tr>
                                    <td>${ele.id}</td>
                                    <td>${ele.name}</td>
                                    <td>${ele.email}</td>
                                    <td>${ele.phone}</td>
                                    <td>
                                        <button  class="btn btn-sm btn-warning" onclick='studentbyid(${ele.id})'>Edit</button>
                                        <button class="btn btn-sm btn-danger" onclick='deletestudent(${ele.id})' >Delete</button>
                                    </td>
                                </tr>`
                })
                $("#tdata").html(rows)
            })
        }

        function display() {
            $.get('display', {}, function (rt) {

                var rows = ""
                rt.students.map(ele => {
                    rows += `<tr>
                                    <td>${ele.id}</td>
                                    <td>${ele.name}</td>
                                    <td>${ele.email}</td>
                                    <td>${ele.phone}</td>
                                    <td>
                                        <button  class="btn btn-sm btn-warning" onclick='studentbyid(${ele.id})'>Edit</button>
                                        <button class="btn btn-sm btn-danger" onclick='deletestudent(${ele.id})' >Delete</button>
                                    </td>
                                </tr>`
                })
                $("#tdata").html(rows)
            })
        }
        function addStudent(event) {

            var name = $("#name").val()
            var email = $("#email").val()
            var phone = $("#phone").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();



            $.post("reg", { csrfmiddlewaretoken, name, email, phone }, function (rt) {
                alert(rt)

                $("#name").val("")
                $("#email").val("")
                $("#phone").val("")

                display()
            })
        }

        function deletestudent(sid) {

            var result = confirm("Are you sure want delete item?")
            if (result) {
                $.get('delete', { sid }, function (rt) {
                    alert(rt)
                    display()
                })
            }

        }

        function studentbyid(sid) {

            $.get("stbyid", { sid }, function (rt) {

                $("#id").val(rt.student[0].id)
                $("#name").val(rt.student[0].name)
                $("#email").val(rt.student[0].email)
                $("#phone").val(rt.student[0].phone)

                $("#upbtn").show()
                $("#smbtn").hide()
            })
        }

        function updateStudent() {

            var id = $("#id").val()
            var name = $("#name").val()
            var email = $("#email").val()
            var phone = $("#phone").val()
            var csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();



            $.post("update", { csrfmiddlewaretoken, id, name, email, phone }, function (rt) {
                alert(rt)

                $("#id").val("")
                $("#name").val("")
                $("#email").val("")
                $("#phone").val("")

                display()

                $("#upbtn").hide()
                $("#smbtn").show()
            })
        }

        function checkemail(email) {
            $.get("checkemail", { email }, function (rt) {

                if (rt == 'True') {
                     $('#smbtn').attr('disabled','disabled');
                    $("#email").css("border", "1px solid red")
                    $("#emailErr").html("Email alredy exist !!!")
                }
                else{

                     $("#email").css("border", "")
                    $("#emailErr").html("")
                     $('#smbtn').attr('disabled',false);
                }
            })
        }
    </script>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <h2 class="text-center mb-4">Student Registration</h2>

        <div class="row">

            <!-- Form Section -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Register Student
                    </div>
                    <div class="card-body">

                        <input type="hidden" id="id">
                        {%csrf_token%}
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" placeholder="Enter name" id="name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter email" id="email"
                                onkeyup="checkemail(value)">
                            <span id="emailErr" class="text-danger"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" placeholder="Enter phone" id="phone">
                        </div>

                        <button class="btn btn-success w-100" onclick="addStudent()" id="smbtn">
                            Submit
                        </button>
                        <button class="btn btn-success w-100" onclick="updateStudent()" id="upbtn">
                            Update
                        </button>

                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        Student List
                    </div>
                    <div class="card-body p-0">
                        <input type="text" class="form-control" placeholder="Search...." onkeyup="search(value)">
                        <table class="table table-bordered table-striped m-0 text-center">
                            <thead class="table-secondary">
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tdata">
                                <!-- Sample Data -->


                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
