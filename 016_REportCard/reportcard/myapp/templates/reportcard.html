<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Report Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #eef2f7;
        }

        .card-wrap {
            max-width: 900px;
            margin: 40px auto;
        }

        .header {
            background: #0d6efd;
            color: #fff;
            border-radius: 14px 14px 0 0;
        }

        .header h2 {
            margin: 0;
        }

        .info {
            background: #f8f9fa;
            border-radius: 10px;
        }

        .rank {
            font-weight: 700;
            font-size: 22px;
        }
    </style>
</head>

<body>
    <div class="card shadow card-wrap">
        <div class="header p-4 text-center">
            <h2>Student Report Card</h2>
            <small>Academic Year 2025-2026</small>
        </div>
        <div class="card-body">
            <!-- Student Info -->
            <div class="row g-3 mb-4 info p-3">
                <div class="col-md-4"><strong>Name:</strong> {{ marks.0.student.name }}</div>
                <div class="col-md-4"><strong>Email:</strong> {{ marks.0.student.email }}</div>
                <div class="col-md-4"><strong>Age:</strong> {{ marks.0.student.age }}</div>
            </div>

            <!-- Marks Table -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Subject</th>
                            <th>Marks (50)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {%for mark in marks%}
                        <tr>
                            <td>{{mark.subject.name}}</td>
                            <td>{{ mark.marks }}</td>
                        </tr>
                        {%endfor%}

                    </tbody>
                </table>
            </div>

            <!-- Summary -->
            <div class="row g-3 mt-3">
                <div class="col-md-4">
                    <div class="alert alert-info mb-0"><strong>Total:</strong> {{total }} / 300</div>
                </div>
                <div class="col-md-4">
                    <div class="alert alert-warning mb-0"><strong>Percentage:</strong> {{ per }}%</div>
                </div>
                <div class="col-md-4 text-center">
                    <div class="alert alert-success mb-0"><span class="rank">Rank: {{ rank }}</span></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
