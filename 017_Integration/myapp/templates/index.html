    <!DOCTYPE html>

    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Communication Center</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

        <style>
            body {
                background: linear-gradient(120deg, #edf2ff, #f8f9fa);
                min-height: 100vh;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            /* Header */
            .main-title {
                background: #0d6efd;
                color: white;
                padding: 18px;
                text-align: center;
                font-size: 24px;
                font-weight: 600;
                border-radius: 12px;
                margin-bottom: 20px;
            }

            /* Card Styling */
            .custom-card {
                border: none;
                border-radius: 14px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
                transition: 0.3s;
            }

            .custom-card:hover {
                transform: translateY(-4px);
            }

            /* Form */
            .form-control {
                border-radius: 10px;
                padding: 11px;
            }

            .form-control:focus {
                border-color: #0d6efd;
                box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .2);
            }

            .btn-send {
                border-radius: 10px;
                padding: 11px;
                font-weight: 600;
            }

            /* payment box */
            .payment-box {
                text-align: center;
            }

            .payment-box input {
                text-align: center;
                font-weight: 600;
            }

            .footer {
                text-align: center;
                font-size: 13px;
                color: #6c757d;
                margin-top: 15px;
            }
        </style>

    </head>

    <body>

        <div class="container py-4">

            ```
            <div class="main-title">
                📨 Communication Center (Email • SMS • Payment)
            </div>

            <div class="row g-4">

                <!-- ================= EMAIL ================= -->
                <div class="col-lg-4">
                    <div class="card custom-card h-100">
                        <div class="card-header bg-primary text-white fw-semibold text-center">
                            📧 Send Email
                        </div>
                        <div class="card-body">

                            {{msg}}

                            <form action="{%url 'sendmail'%}" method="post">
                                {%csrf_token%}

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">From Email</label>
                                    <input type="email" class="form-control" name="from" placeholder="Enter your email">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Subject</label>
                                    <input type="text" class="form-control" name="subject" placeholder="Enter subject">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Message</label>
                                    <textarea rows="6" class="form-control" name="message"
                                        placeholder="Write your email..."></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-send">Send Email</button>
                                    <button type="reset" class="btn btn-outline-secondary">Clear</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>

                <!-- ================= SMS ================= -->
                <div class="col-lg-4">
                    <div class="card custom-card h-100">
                        <div class="card-header bg-success text-white fw-semibold text-center">
                            📱 Send SMS
                        </div>
                        <div class="card-body">

                            {{success}}

                            <form action="{%url 'sendsms'%}" method="post">
                                {%csrf_token%}

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Phone Number</label>
                                    <input type="tel" class="form-control" name="phone" placeholder="9876543210">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">SMS Message</label>
                                    <textarea rows="6" class="form-control" name="message"
                                        placeholder="Type SMS message..."></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-send">Send SMS</button>
                                    <button type="reset" class="btn btn-outline-secondary">Clear</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>

                <!-- ================= PAYMENT ================= -->
                <div class="col-lg-4">
                    <div class="card custom-card h-100">
                        <div class="card-header bg-dark text-white fw-semibold text-center">
                            💳 Razorpay Payment
                        </div>
                        <div class="card-body payment-box">

                            <label class="fw-semibold mb-2">Enter Amount (₹)</label>
                            <input type="number" id="amt" class="form-control mb-3" placeholder="Enter amount">

                            <button id="rzp-button1" class="btn btn-warning w-100 btn-send">
                                Pay with Razorpay
                            </button>

                        </div>
                    </div>
                </div>

            </div>

            <div class="footer">
                Bootstrap 5 Horizontal Dashboard UI
            </div>
            ```

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>

        document.getElementById('rzp-button1').onclick = function (e) {

            e.preventDefault();
            var amt = $("#amt").val()
            $.get("payment", { amt }, function (rt) {

                var options = {
                    "key": "rzp_test_SF5R7ur5nvvYLR", // Enter the Key ID generated from the Dashboard
                    "amount": rt.amount, // Amount is in currency subunits. 
                    "currency": "INR",
                    "name": "Tops Tech",
                    "description": "Test Transaction",
                    "image": "https://example.com/your_logo",
                    "order_id": rt.id, //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
                    "handler": function (response) {
                        alert(response.razorpay_payment_id);
                        alert(response.razorpay_order_id);
                        alert(response.razorpay_signature)
                    },
                    "prefill": {
                        "name": "<name>",
                        "email": "<email>",
                        "contact": "<phone>"
                    },
                    "notes": {
                        "address": "Razorpay Corporate Office"
                    },
                    "theme": {
                        "color": "#3399cc"
                    }
                };
                var rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response) {
                    alert(response.error.code);
                    alert(response.error.description);
                    alert(response.error.source);
                    alert(response.error.step);
                    alert(response.error.reason);
                    alert(response.error.metadata.order_id);
                    alert(response.error.metadata.payment_id);
                });
                rzp1.open();
            })


        }


    </script>
