<body>
    <!DOCTYPE html>

    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Compose Mail</title>

        <!-- Bootstrap 5 -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            /* Card Design */
            .mail-card {
                width: 100%;
                max-width: 650px;
                border: none;
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            }

            /* Header */
            .mail-header {
                background: #0d6efd;
                color: white;
                padding: 18px;
                font-size: 22px;
                font-weight: 600;
                text-align: center;
                letter-spacing: 1px;
            }

            /* Form Fields */
            .form-control {
                border-radius: 10px;
                padding: 12px;
            }

            .form-control:focus {
                box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, .25);
                border-color: #0d6efd;
            }

            textarea {
                resize: none;
            }

            /* Buttons */
            .btn-send {
                border-radius: 10px;
                padding: 12px;
                font-size: 18px;
                font-weight: 600;
            }

            .btn-reset {
                border-radius: 10px;
                padding: 10px;
            }

            /* Footer */
            .footer {
                text-align: center;
                font-size: 13px;
                color: #6c757d;
                margin-top: 10px;
            }
        </style>

    </head>

    <body>

        <div class="card mail-card">


            <div class="mail-header">
                📧 Compose Email
            </div>

            <div class="card-body p-4">
                {{msg}}
                <!-- FORM -->
                <form method="post" action="{%url 'sendmail'%}">
                    {%csrf_token%}
                    <!-- FROM -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">From Email</label>
                        <input type="email" name="from" class="form-control" placeholder="Enter your email address">
                    </div>

                    <!-- SUBJECT -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="Enter subject">
                    </div>

                    <!-- MESSAGE -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea name="message" rows="7" class="form-control"
                            placeholder="Write your message here..."></textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-send">
                            Send Mail
                        </button>

                        <button type="reset" class="btn btn-outline-secondary btn-reset">
                            Clear
                        </button>
                    </div>

                </form>

                <div class="footer mt-3">
                    Email form UI using Bootstrap 5
                </div>

            </div>


        </div>

    </body>

    </html>

</body>

</html>
