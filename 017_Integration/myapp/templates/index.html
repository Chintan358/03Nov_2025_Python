<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Mail & SMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .mail-card {
            width: 100%;
            max-width: 650px;
            border: none;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }

        .mail-header {
            background: #0d6efd;
            color: white;
            padding: 18px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, .25);
            border-color: #0d6efd;
        }

        textarea {
            resize: none;
        }

        .btn-send {
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-top: 25px;
            margin-bottom: 10px;
            color: #198754;
        }

        .divider {
            border-top: 2px dashed #ced4da;
            margin: 30px 0;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #6c757d;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="card mail-card">

        <div class="mail-header">
            📨 Communication Center
        </div>

        <div class="card-body p-4">

            <!-- ================= EMAIL FORM ================= -->

            <h5 class="mb-3 fw-bold text-primary">📧 Send Email</h5>
            {{msg}}
            <form action="{%url 'sendmail'%}" method="post">
                {%csrf_token%}
                <div class="mb-3">
                    <label class="form-label fw-semibold">From Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email address" name="from">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject</label>
                    <input type="text" class="form-control" placeholder="Enter subject" name="subject">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Message</label>
                    <textarea rows="7" class="form-control" placeholder="Write your message here..."
                        name="message"></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-send">Send Email</button>
                    <button type="reset" class="btn btn-outline-secondary">Clear</button>
                </div>

            </form>

            <!-- DIVIDER -->

            <div class="divider"></div>

            <!-- ================= SMS FORM ================= -->

            <h5 class="section-title">📱 Send SMS</h5>
            {{success}}
            <form action="{%url 'sendsms'%}" method="post">
                {%csrf_token%}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="Enter phone number (9876543210)" name="phone">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">SMS Message</label>
                    <textarea rows="6" class="form-control" placeholder="Type your SMS message here..."
                        name="message"></textarea>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-send">Send SMS</button>
                    <button type="reset" class="btn btn-outline-secondary">Clear</button>
                </div>

            </form>

            <div class="footer mt-3">
                Email & SMS UI using Bootstrap 5
            </div>

        </div>
    </div>

</body>

</html>
