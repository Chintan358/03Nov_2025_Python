<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        form {
            background: #ffffff;
            padding: 20px 25px;
            width: 900px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 7px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: none;
            height: 55px;
        }

        .full {
            grid-column: 1 / 3;
        }

        .options {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
        }

        .btns {
            text-align: center;
            margin-top: 10px;
        }

        input[type="submit"],
        input[type="reset"] {
            width: 120px;
            margin: 5px;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"] {
            background: #007bff;
            color: #fff;
        }

        input[type="reset"] {
            background: #6c757d;
            color: #fff;
        }
    </style>
</head>

<body>

    <form >
        <h2>Registration Form</h2>

        <div class="form-grid">
            <div>
                <label>Username</label>
                <input type="text" name="uname">
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div>
                <label>Password</label>
                <input type="password" name="pass">
            </div>

            <div>
                <label>Phone</label>
                <input type="number" name="phone">
            </div>

            <div>
                <label>Gender</label>
                <div class="options">
                    <input type="radio" name="gender" checked> Male
                    <input type="radio" name="gender"> Female
                </div>
            </div>

            <div>
                <label>Languages</label>
                <div class="options">
                    <input type="checkbox"> Eng
                    <input type="checkbox"> Hin
                    <input type="checkbox"> Guj
                </div>
            </div>

            <div>
                <label>Country</label>
                <select>
                    <option>India</option>
                    <option>USA</option>
                    <option>UK</option>
                </select>
            </div>

            <div>
                <label>DOB</label>
                <input type="date">
            </div>

            <div>
                <label>Color</label>
                <input type="color">
            </div>

            <div>
                <label>Address</label>
                <textarea></textarea>
            </div>

            <div class="full btns">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
        </div>
    </form>

</body>

</html>
